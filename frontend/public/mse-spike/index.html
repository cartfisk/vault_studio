<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MSE codec spike</title>
  <style>
    body { font: 16px -apple-system, system-ui, sans-serif; margin: 1rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    td, th { border: 1px solid #ccc; padding: .4rem; text-align: left; }
    .yes { color: #0a0; font-weight: 600; }
    .no { color: #c00; font-weight: 600; }
    pre { background: #f4f4f4; padding: .5rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>MSE codec spike</h1>
  <table id="support"></table>
  <audio id="player" controls playsinline></audio>
  <p>
    <button data-mode="aac-untrimmed">AAC, untrimmed</button>
    <button data-mode="aac-trimmed">AAC, trimmed</button>
    <button data-mode="alac-trimmed">ALAC, trimmed</button>
    <button data-mode="alac-big">ALAC, 4min (memory)</button>
  </p>
  <p>
    <strong>Round two:</strong>
    <button data-mode="aac-overlap">AAC, overlap</button>
    <button data-mode="aac-headtrim">AAC, head trim</button>
    <button data-mode="aac-elst">AAC, overlap + edit list</button>
    <button data-mode="alac-exact">ALAC, exact (no trim)</button>
  </p>
  <h2>Log</h2>
  <pre id="log"></pre>

  <script type="module">
    import { computeAppendPlan } from './trim.js';
    const AAC = 'audio/mp4; codecs="mp4a.40.2"';
    const ALAC = 'audio/mp4; codecs="alac"';

    const logEl = document.getElementById('log');
    function log(line) {
      logEl.textContent += line + '\n';
    }

    log('user agent: ' + navigator.userAgent);

    const hasManaged = 'ManagedMediaSource' in window;
    const hasPlain = 'MediaSource' in window;
    const Impl = window.ManagedMediaSource ?? window.MediaSource;

    const rows = [
      ['ManagedMediaSource present', hasManaged],
      ['MediaSource present', hasPlain],
      ['AAC supported', Impl ? Impl.isTypeSupported(AAC) : false],
      ['ALAC supported', Impl ? Impl.isTypeSupported(ALAC) : false],
    ];

    document.getElementById('support').innerHTML =
      '<tr><th>Check</th><th>Result</th></tr>' +
      rows.map(([label, ok]) =>
        `<tr><td>${label}</td><td class="${ok ? 'yes' : 'no'}">${ok}</td></tr>`
      ).join('');

    for (const [label, ok] of rows) log(`${label}: ${ok}`);

    window.spikeLog = log;
    window.spikeImpl = Impl;
    window.spikeTypes = { AAC, ALAC };

    const audio = document.getElementById('player');
    const fixtures = await fetch('./fixtures/fixtures.json').then(r => r.json());

    // strategy:
    //   'window'   round one — clip each segment with appendWindow. Failed on
    //              Safari, which clips to the last complete frame and so
    //              discards real audio.
    //   'sequence' no trimming at all; the encoder's overshoot plays as audio.
    //   'overlap'  round two — no clipping. Place each segment earlier by its
    //              own priming, so the priming lands on top of the previous
    //              segment's tail and real audio starts on the exact boundary.
    //              Never asks the browser to cut mid-frame.
    //   'exact'    round two — no clipping, no compensation, segments placed at
    //              their true boundaries. Correct only for a format that
    //              reports its true length, which ALAC now does.
    const MODES = {
      'aac-untrimmed': { type: AAC, files: ['h1-aac.mp4', 'h2-aac.mp4'], strategy: 'sequence' },
      'aac-trimmed':   { type: AAC, files: ['h1-aac.mp4', 'h2-aac.mp4'], strategy: 'window' },
      'alac-trimmed':  { type: ALAC, files: ['h1-alac.mp4', 'h2-alac.mp4'], strategy: 'window' },
      'alac-big':      { type: ALAC, files: ['big-alac.mp4'], strategy: 'sequence' },

      'aac-overlap':   { type: AAC, files: ['h1-aac.mp4', 'h2-aac.mp4'], strategy: 'overlap' },
      'aac-headtrim':  { type: AAC, files: ['h1-aac.mp4', 'h2-aac.mp4'], strategy: 'headtrim' },
      'aac-elst':      { type: AAC, files: ['h1-aac-elst.mp4', 'h2-aac-elst.mp4'], strategy: 'overlap' },
      'alac-exact':    { type: ALAC, files: ['h1-alac.mp4', 'h2-alac.mp4'], strategy: 'exact' },
    };

    function primingSeconds(file) {
      const entry = fixtures.encoded[file];
      if (!entry) return 0;
      return entry.overshootSamples / fixtures.sampleRate;
    }

    function ranges(buffered) {
      const out = [];
      for (let i = 0; i < buffered.length; i++) {
        out.push(`[${buffered.start(i).toFixed(4)}, ${buffered.end(i).toFixed(4)}]`);
      }
      return out.join(' ') || '(none)';
    }

    function once(target, event) {
      return new Promise(resolve =>
        target.addEventListener(event, resolve, { once: true }));
    }

    async function run(mode) {
      const { type, files, strategy } = MODES[mode];
      const trim = strategy === 'window';
      log(`\n--- ${mode} ---`);

      if (!Impl || !Impl.isTypeSupported(type)) {
        log(`unsupported: ${type}`);
        return;
      }

      const ms = new Impl();
      // ManagedMediaSource attaches via srcObject and refuses to attach while
      // remote playback is enabled. Plain MediaSource needs an object URL.
      if (window.ManagedMediaSource && ms instanceof window.ManagedMediaSource) {
        audio.disableRemotePlayback = true;
        audio.srcObject = ms;
      } else {
        audio.src = URL.createObjectURL(ms);
      }

      await once(ms, 'sourceopen');
      const sb = ms.addSourceBuffer(type);
      sb.mode = strategy === 'sequence' ? 'sequence' : 'segments';

      // An append that fails leaves an unchanged buffered range and nothing
      // else. On a phone with no inspector attached that is indistinguishable
      // from success, so say so out loud.
      sb.addEventListener('error', () => log('  SOURCEBUFFER ERROR'));

      for (let i = 0; i < files.length; i++) {
        const buf = await fetch(`./fixtures/${files[i]}`).then(r => r.arrayBuffer());
        if (trim) {
          const plan = computeAppendPlan({
            trueDuration: fixtures.trueDurationPerHalf,
            index: i,
          });
          // Order matters: appendWindowStart must be strictly less than the
          // current appendWindowEnd. Moving the window forward without
          // widening it first throws — on append 1 the end is still the
          // previous append's, so setting start to that value is out of range.
          sb.appendWindowEnd = plan.appendWindowEnd;
          sb.appendWindowStart = plan.appendWindowStart;
          sb.timestampOffset = plan.timestampOffset;
          log(`append ${files[i]} offset=${plan.timestampOffset} ` +
              `window=[${plan.appendWindowStart}, ${plan.appendWindowEnd}]`);
        } else if (strategy === 'headtrim') {
          // Overlap alone leaves a notch: the next segment is pulled back by
          // its full 1024-sample priming, but the previous segment's tail
          // padding is only 344 samples, so 680 samples of real audio get
          // overwritten with the incoming segment's silence.
          //
          // Clip the priming off the HEAD instead. Priming is exactly one AAC
          // frame, so this cut lands on a frame boundary — the thing Safari
          // refused to do at the tail, where the cut fell mid-frame. The tail
          // is never clipped; the next segment's real audio overwrites it.
          const priming = primingSeconds(files[i]);
          const boundary = i * fixtures.trueDurationPerHalf;
          sb.appendWindowEnd = Infinity;
          sb.appendWindowStart = boundary;
          sb.timestampOffset = boundary - priming;
          log(`append ${files[i]} offset=${(boundary - priming).toFixed(6)} ` +
              `headtrim from ${boundary.toFixed(6)} ` +
              `(priming ${(priming * fixtures.sampleRate).toFixed(0)} samples)`);
        } else if (strategy === 'overlap' || strategy === 'exact') {
          // No append window at all — nothing is clipped, so the browser never
          // has to cut mid-frame. Placement alone decides where real audio
          // lands. Under 'overlap' each segment is pulled back by its own
          // priming so the priming overwrites the previous segment's tail.
          const priming = strategy === 'overlap' ? primingSeconds(files[i]) : 0;
          const offset = i * fixtures.trueDurationPerHalf - priming;
          sb.appendWindowStart = 0;
          sb.appendWindowEnd = Infinity;
          sb.timestampOffset = offset;
          log(`append ${files[i]} offset=${offset.toFixed(6)} ` +
              `(${strategy}, priming ${(priming * fixtures.sampleRate).toFixed(0)} samples)`);
        } else {
          log(`append ${files[i]} (mode=sequence, no trim)`);
        }
        sb.appendBuffer(buf);
        await once(sb, 'updateend');
        log(`  buffered: ${ranges(sb.buffered)}`);
      }

      ms.endOfStream();
      log(`final buffered: ${ranges(sb.buffered)}`);
      log(`range count: ${sb.buffered.length} (1 = joined, 2 = seam)`);
      await audio.play();
    }

    for (const button of document.querySelectorAll('button[data-mode]')) {
      button.addEventListener('click', () => {
        run(button.dataset.mode).catch(err => log('ERROR: ' + err.message));
      });
    }
  </script>
</body>
</html>
